allowBuilds:
  # post-install script is only needed for legacy npm versions and can be disabled for modern versions
  # https://github.com/unrs/unrs-resolver/issues/193#issuecomment-4397843323
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@decimalturn/toml-patch'
  
overrides:
  # https://github.com/DecimalTurn/toml-patch/security/dependabot/80
  vite: ">=8.1.6"
  # https://github.com/DecimalTurn/toml-patch/security/dependabot/85
  minimatch: ">=11.0.1"