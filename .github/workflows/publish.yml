# Auth: Trusted Publishing: https://docs.npmjs.com/trusted-publishers

name: Publish Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Might be used by jsr for authentication purposes
    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org/'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
        continue-on-error: true

      - name: Publish to npm
        id: pnpm-publish
        run: pnpm publish --provenance --no-git-checks
        continue-on-error: true

      - name: Check git status
        run: git status && git diff

      - name: Publish to jsr
        run: pnpm run publish:jsr
        if: success() || steps.pnpm-publish.outcome == 'failure'
