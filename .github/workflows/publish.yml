# Auth: Trusted Publishing: https://docs.npmjs.com/trusted-publishers

name: Publish Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Might be used by jsr for authentication purposes
    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org/'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        id: build
        run: pnpm run build
        continue-on-error: true

      - name: Check dev package
        id: dev-package-exists
        if: always()
        # A rerun may reach this workflow after the dev version was published.
        # The following command will return an error if the dev version does not exist.
        # A successful run indicates that the dev version exists.
        run: npm view @decimalturn/toml-patch@$(node -p "require('./package.json').version")-dev version
        continue-on-error: true

      - name: Prepare dev package
        if: steps.build.outcome == 'success' && steps.dev-package-exists.outcome != 'success'
        run: pnpm run build:dev

      - name: Publish dev package
        if: steps.build.outcome == 'success' && steps.dev-package-exists.outcome != 'success'
        id: dev-publish
        run: npm publish ./dist/dev-package --tag dev --provenance --ignore-scripts

      - name: Publish to npm
        id: pnpm-publish
        run: pnpm publish --provenance --no-git-checks
        continue-on-error: true

      - name: Check git status
        run: git status && git diff

      - name: Publish to jsr
        run: pnpm run publish:jsr
        if: success() || steps.pnpm-publish.outcome == 'failure'
