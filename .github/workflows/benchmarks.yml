name: Benchmarks
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'Published toml-patch version to also benchmark in the smol-toml job (leave empty to skip)'
        required: false
        default: ''
  pull_request:
    paths:
      - 'src/**'
      - 'benchmark/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  # Both benchmark jobs consume this build, so they always measure the same bundle.
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
    # Protection Against Supply Chain Attacks: https://socket.dev/blog/introducing-socket-firewall
    - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall
        firewall-version: latest # or use a pinned version (see releases)
    - name: Install
      run: sfw pnpm install --frozen-lockfile
      env:
        CI: true
    - name: Build
      run: pnpm run build
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  benchmark-iarna:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
    # Protection Against Supply Chain Attacks: https://socket.dev/blog/introducing-socket-firewall
    - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall
        firewall-version: latest # or use a pinned version (see releases)
    - name: Install
      run: sfw pnpm install --frozen-lockfile
      env:
        CI: true
    - name: Download build
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist
    # The gate runs the curated sample on pull requests and the full corpus when
    # the workflow is dispatched by hand.
    - name: Benchmark iarna fixtures
      env:
        DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        if [ "$DISPATCH" = "true" ]; then
          pnpm run bench:iarna
        else
          pnpm run bench:iarna:ci
        fi

  benchmark-smol:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
    # Protection Against Supply Chain Attacks: https://socket.dev/blog/introducing-socket-firewall
    - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall
        firewall-version: latest # or use a pinned version (see releases)
    - name: Install
      run: sfw pnpm install --frozen-lockfile
      env:
        CI: true
    - name: Download build
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist
    - name: Benchmark smol-toml fixtures
      env:
        VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      run: |
        if [ -n "$VERSION" ]; then
          pnpm run bench:smol -- --versions "$VERSION"
        else
          pnpm run bench:smol
        fi
