name: Benchmarks
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'Published toml-patch version to also benchmark in the smol-toml job (leave empty to skip)'
        required: false
        default: ''
  pull_request:
    paths:
      - 'src/**'
      - 'benchmark/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  # Both benchmark jobs consume this build, so they always measure the same bundle.
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
    # Protection Against Supply Chain Attacks: https://socket.dev/blog/introducing-socket-firewall
    - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall
        firewall-version: latest # or use a pinned version (see releases)
    - name: Install
      run: sfw pnpm install --frozen-lockfile
      env:
        CI: true
    - name: Build
      run: pnpm run build
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  # The base branch build is the reference the pull request benchmarks compare
  # against. It runs in parallel with the build above.
  build-baseline:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout base branch
      uses: actions/checkout@v7
      with:
        ref: ${{ github.base_ref || 'latest' }}
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
    # Protection Against Supply Chain Attacks: https://socket.dev/blog/introducing-socket-firewall
    - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall
        firewall-version: latest # or use a pinned version (see releases)
    - name: Install
      run: sfw pnpm install --frozen-lockfile
      env:
        CI: true
    - name: Build
      run: pnpm run build
    - name: Upload baseline build
      uses: actions/upload-artifact@v7
      with:
        name: dist-baseline
        path: dist/

  benchmark-iarna:
    needs: [build, build-baseline]
    # Run even when the baseline build fails, so a broken base branch cannot
    # block the pull request benchmarks.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
    # Protection Against Supply Chain Attacks: https://socket.dev/blog/introducing-socket-firewall
    - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall
        firewall-version: latest # or use a pinned version (see releases)
    - name: Install
      run: sfw pnpm install --frozen-lockfile
      env:
        CI: true
    - name: Download build
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist
    - name: Download baseline build
      id: baseline
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: dist-baseline
        path: baseline
    # The gate runs the curated sample on pull requests and the full corpus when
    # the workflow is dispatched by hand. The baseline is only passed when it
    # downloaded, so a failed base branch build degrades to a plain benchmark run.
    - name: Benchmark iarna fixtures
      env:
        DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        BENCH_BASELINE: ${{ steps.baseline.outcome == 'success' && 'baseline/toml-patch.js' || '' }}
      run: |
        if [ "$DISPATCH" = "true" ]; then
          pnpm run bench:iarna
        else
          pnpm run bench:iarna:ci
        fi
    - name: Upload benchmark summary
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-iarna-summary
        path: |
          benchmark-parse.md
          benchmark-stringify.md
        if-no-files-found: ignore

  benchmark-smol:
    needs: [build, build-baseline]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
    # Protection Against Supply Chain Attacks: https://socket.dev/blog/introducing-socket-firewall
    - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall
        firewall-version: latest # or use a pinned version (see releases)
    - name: Install
      run: sfw pnpm install --frozen-lockfile
      env:
        CI: true
    - name: Download build
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist
    - name: Download baseline build
      id: baseline
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: dist-baseline
        path: baseline
    - name: Benchmark smol-toml fixtures
      env:
        VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        BENCH_BASELINE: ${{ steps.baseline.outcome == 'success' && 'baseline/toml-patch.js' || '' }}
      run: |
        if [ -n "$VERSION" ]; then
          pnpm run bench:smol -- --versions "$VERSION"
        else
          pnpm run bench:smol
        fi
    - name: Upload benchmark summary
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-smol-summary
        path: benchmark-smol.md
        if-no-files-found: ignore

  # Posts one comment on the pull request holding every benchmark summary. The
  # comment is updated in place on later pushes instead of piling up.
  report:
    needs: [benchmark-iarna, benchmark-smol]
    if: always() && !cancelled() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Download benchmark summaries
      uses: actions/download-artifact@v8
      with:
        pattern: benchmark-*-summary
        merge-multiple: true
        path: summaries
    - name: Build comment
      run: |
        {
          echo '<!-- benchmark-summary -->'
          echo '## Benchmark comparison'
          echo ''
          echo "This branch measured against \`${{ github.base_ref || 'latest' }}\` in one run on the same runner."
          echo 'Ratios close to 1.0 are within run to run noise.'
          echo ''
          for file in summaries/benchmark-parse.md summaries/benchmark-stringify.md summaries/benchmark-smol.md; do
            if [ -f "$file" ]; then
              sed -e 's/^# /### /' -e 's/^## /#### /' "$file"
              echo ''
            fi
          done
        } > comment.md
        cat comment.md
    - name: Post comment
      # Fork pull requests get a read-only token, so they cannot comment.
      if: github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
          -q '.[] | select(.body | contains("<!-- benchmark-summary -->")) | .id' | head -n 1)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@comment.md
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md
        fi
