name: Benchmarks
on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'Published toml-patch version to also benchmark in the benchmark job (leave empty to skip)'
        required: false
        default: ''
  pull_request:
    paths:
      - 'src/**'
      - 'benchmark/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  # The benchmark job consumes this build, so it always measures the same bundle.
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
    # Protection Against Supply Chain Attacks: https://socket.dev/blog/introducing-socket-firewall
    - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall
        firewall-version: latest # or use a pinned version (see releases)
    - name: Install
      run: sfw pnpm install --frozen-lockfile
      env:
        CI: true
    - name: Build
      run: pnpm run build
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  # The base branch build is the reference the pull request benchmarks compare
  # against. It runs in parallel with the build above.
  build-baseline:
    outputs:
      version: ${{ steps.package.outputs.version }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout base branch
      uses: actions/checkout@v7
      with:
        ref: ${{ github.base_ref || 'latest' }}
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
    - name: Read package version
      id: package
      run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
    # Protection Against Supply Chain Attacks: https://socket.dev/blog/introducing-socket-firewall
    - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall
        firewall-version: latest # or use a pinned version (see releases)
    - name: Install
      run: sfw pnpm install --frozen-lockfile
      env:
        CI: true
    - name: Build
      run: pnpm run build
    - name: Upload baseline build
      uses: actions/upload-artifact@v7
      with:
        name: dist-baseline
        path: dist/

  benchmark-run:
    needs: [build, build-baseline]
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        scenario: [parse, stringify, patch]
    name: Benchmark ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
    # Protection Against Supply Chain Attacks: https://socket.dev/blog/introducing-socket-firewall
    - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall
        firewall-version: latest # or use a pinned version (see releases)
    - name: Install
      run: sfw pnpm install --frozen-lockfile
      env:
        CI: true
    - name: Download build
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist
    - name: Download baseline build
      id: baseline
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: dist-baseline
        path: baseline
    # Each matrix leg benchmarks one workload on its own runner. The baseline is
    # only passed when it downloaded, so a failed base build skips ratio gates.
    - name: Run benchmark scenario
      env:
        SCENARIO: ${{ matrix.scenario }}
        DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        BENCH_BASELINE: ${{ steps.baseline.outcome == 'success' && 'baseline/toml-patch.js' || '' }}
        BENCH_BASELINE_VERSION: ${{ needs.build-baseline.outputs.version }}
      run: |
        if [ "$SCENARIO" = "patch" ]; then
          pnpm run bench:patch
        elif [ -n "$VERSION" ] && [ "$DISPATCH" = "true" ]; then
          pnpm run bench:all -- --type "$SCENARIO" --versions "$VERSION"
        elif [ -n "$VERSION" ]; then
          pnpm run bench -- --type "$SCENARIO" --versions "$VERSION"
        elif [ "$DISPATCH" = "true" ]; then
          pnpm run bench:all -- --type "$SCENARIO"
        else
          pnpm run bench -- --type "$SCENARIO"
        fi
    - name: Select benchmark report
      if: always()
      id: report
      env:
        SCENARIO: ${{ matrix.scenario }}
      run: |
        if [ "$SCENARIO" = "patch" ]; then
          echo "path=benchmark/patch-benchmark.md" >> "$GITHUB_OUTPUT"
        else
          echo "path=benchmark-fixtures-$SCENARIO.md" >> "$GITHUB_OUTPUT"
        fi
    - name: Upload scenario report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-${{ matrix.scenario }}
        path: ${{ steps.report.outputs.path }}
        if-no-files-found: ignore

  # Absolute bundle size budgets from benchmark/thresholds.toml. This is its own
  # job because a failure in the reference comparison above would skip the gate.
  bundle-size:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
    # Protection Against Supply Chain Attacks: https://socket.dev/blog/introducing-socket-firewall
    - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall
        firewall-version: latest # or use a pinned version (see releases)
    - name: Install
      run: sfw pnpm install --frozen-lockfile
      env:
        CI: true
    # The bundling scripts install esbuild into .bench-cache on first use.
    # Fetching it through the firewall keeps the supply chain protection in place
    # and means the job downloads nothing at run time.
    - name: Install esbuild for bundling
      run: sfw npm install --prefix .bench-cache/esbuild --no-save --no-package-lock esbuild
    - name: Download build
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist
    - name: Bundle size budgets
      run: pnpm run bench:patch-lite

  # Posts one comment on the pull request holding every benchmark summary. The
  # comment is updated in place on later pushes instead of piling up.
  report:
    needs: [benchmark-run]
    if: always() && !cancelled() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - name: Download parse report
      if: always()
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: benchmark-parse
        path: summaries/parse
    - name: Download stringify report
      if: always()
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: benchmark-stringify
        path: summaries/stringify
    - name: Download patch report
      if: always()
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: benchmark-patch
        path: summaries/patch
    - name: Build comment
      run: |
        {
          echo '<!-- benchmark-summary -->'
          echo '## Benchmark comparison'
          echo ''
          echo "Each workload measured this branch against \`${{ github.base_ref || 'latest' }}\` on the same runner."
          echo 'Ratios close to 1.0 are within run to run noise. They indicate improvements (higher is better) compared to baseline.'
          echo ''
          for file in summaries/parse/benchmark-fixtures-parse.md summaries/stringify/benchmark-fixtures-stringify.md summaries/patch/patch-benchmark.md; do
            if [ -f "$file" ]; then
              sed -e 's/^# /### /' -e 's/^## /#### /' "$file"
              echo ''
            fi
          done
        } > comment.md
        cat comment.md
    - name: Post comment
      # Fork pull requests get a read-only token, so they cannot comment.
      if: github.event.pull_request.head.repo.full_name == github.repository
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
          -q '.[] | select(.body | contains("<!-- benchmark-summary -->")) | .id' | head -n 1)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@comment.md
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md
        fi
