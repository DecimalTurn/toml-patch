# Maximum allowed slowdown of the current toml-patch build relative to
# smol-toml, measured in the same benchmark run. The suite fails when
# toml-patch is more than `maxSlowdown` times slower than the reference on any
# fixture for that operation.
#
# The small spec examples carry a fixed per-document overhead, so the parse
# budget leaves room for them. The ~5 MB document is where raw throughput shows
# up.

reference = "smol-toml"

[smol.parse]
maxSlowdown = 8

[smol.stringify]
maxSlowdown = 25
