# Maximum allowed slowdown of the current toml-patch build relative to the
# configured reference, measured in the same benchmark run. The global
# `reference` is the default; a suite may set its own default, and individual
# operations may override it. A suite fails when a maxSlowdown is exceeded.
#
# The small spec examples carry a fixed per-document overhead, so the parse
# budget leaves room for them. The ~5 MB document is where raw throughput shows
# up.


reference = "smol-toml"

# Note that those thresholds are for CI (Linux) and might not apply to 
# other environments (especially Windows).

[fixtures.parse]
maxSlowdown = 8

[fixtures.stringify]
maxSlowdown = 25

# Compare patch throughput with the base-branch build on the same runner.
[fixtures.patch]

[fixtures.patch.in-place-edit]
maxSlowdown = 3
reference = "toml-patch-lite"

[fixtures.patch.aot-unrelated-scalar-edit]
maxSlowdown = 3
reference = "toml-patch-lite"

[fixtures.patch.aot-unrelated-scalar-edit.lite]
maxSlowdown = 10
reference = "smol-toml"


# Bundle size budgets, in kB (1 kB = 1024 bytes). The bundle measurement scripts
# fail when a bundle grows past its budget. A budget key that is left out is not
# gated, and a bundle with no budget at all is measured without failing.
[bundle.patch-lite]
maxMinified = 48
maxGzipped = 15
